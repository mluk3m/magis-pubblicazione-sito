<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account collegato · Magis Magisque Pubblicazione</title><link rel="icon" href="/magis-pubblicazione-sito/icon-256.png"><link rel="stylesheet" href="/magis-pubblicazione-sito/style.css"></head><body><main>
<header><img src="/magis-pubblicazione-sito/icon-256.png" alt=""><div class="brand">Magis Magisque Pubblicazione<small>lo strumento di pubblicazione di Magis Magisque · Velletri (RM)</small></div></header>
<h1 id="t">Un momento…</h1>
<p id="p"></p>
<p><code id="code" style="word-break:break-all"></code></p>
<p><button id="copia" type="button" hidden>Copia il codice</button> <span id="ok"></span></p>
<script>
(function(){
  var q=new URLSearchParams(location.search), t=document.getElementById('t'), p=document.getElementById('p');
  if(q.get('error')){t.textContent="Autorizzazione non completata";p.textContent="Facebook ha risposto: "+(q.get('error_description')||q.get('error'))+". Puoi riprovare quando vuoi.";return;}
  var code=q.get('code');
  if(!code){t.textContent="Nessun codice ricevuto";p.textContent="Torna alla pagina di accesso e riprova.";return;}
  var st=q.get('state')||'';
  if(/^[a-z0-9_-]+\.\d+\.[0-9a-f]{64}$/.test(st)){
    // invito firmato (18 nov 2026): il motore avvia il collegamento da solo, niente codici da copiare
    t.textContent="Collegamento in corso…";
    var box=document.getElementById('code'); if(box&&box.parentNode){box.parentNode.hidden=true;}
    fetch("https://motore.magismagisque.it/meta/collega",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({code:code,invito:st})})
    .then(function(r){return r.json();}).then(function(d){
      if(d.ok){t.textContent="Grazie, autorizzazione ricevuta";
        p.textContent="Ora completiamo il collegamento della Pagina e dell'Instagram (di solito ci vuole un minuto o due). Ti scriveremo noi per confermarti se è andato a buon fine. Puoi chiudere questa pagina.";}
      else{t.textContent="Collegamento non riuscito";
        p.textContent=/non valido o scaduto/.test(d.errore||"")?"Il link non è più valido: scrivici e te ne mandiamo uno nuovo.":"Qualcosa non ha funzionato. Riprova dal link che ti abbiamo mandato, o scrivici.";}
    }).catch(function(){
      // motore non raggiungibile: riserva manuale, il codice si mostra perché si possa mandare a mano
      t.textContent="Collegamento non completato";
      p.textContent="Problema di rete. Manda subito questo codice a Magis Magisque, oppure riprova dal link che ti abbiamo mandato.";
      var box=document.getElementById('code'); if(box){box.textContent=code; if(box.parentNode){box.parentNode.hidden=false;}}
    });
    history.replaceState(null,"",location.pathname);
    return;
  }
  t.textContent="Grazie, autorizzazione ricevuta.";
  p.textContent="Manda questo codice a Magis Magisque (vale pochi minuti): lo useremo una sola volta per completare il collegamento della tua Pagina e del tuo Instagram.";
  document.getElementById('code').textContent=code;
  var b=document.getElementById('copia');b.hidden=false;
  b.onclick=function(){navigator.clipboard.writeText(code).then(function(){document.getElementById('ok').textContent="Copiato ✓";},function(){document.getElementById('ok').textContent="Seleziona il codice e copialo a mano.";});};
})();
</script>
<p><a href="/magis-pubblicazione-sito/">Torna alla home</a></p>

</main></body></html>
