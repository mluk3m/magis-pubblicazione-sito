<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account collegato · Magis Magisque Pubblicazione</title><link rel="icon" href="/magis-pubblicazione-sito/icon-256.png"><link rel="stylesheet" href="/magis-pubblicazione-sito/style.css"></head><body><main>
<header><img src="/magis-pubblicazione-sito/icon-256.png" alt=""><div class="brand">Magis Magisque Pubblicazione<small>lo strumento di pubblicazione di Magis Magisque · Velletri (RM)</small></div></header>
<h1 id="t">Un momento…</h1>
<p id="p"></p>
<p><code id="code"></code></p>
<script>
(function(){
  var q=new URLSearchParams(location.search), t=document.getElementById('t'), p=document.getElementById('p');
  if(q.get('error')){t.textContent="Autorizzazione non completata";p.textContent="TikTok ha risposto: "+(q.get('error_description')||q.get('error'))+". Puoi riprovare quando vuoi.";return;}
  var code=q.get('code');
  if(!code){t.textContent="Nessun codice ricevuto";p.textContent="Torna alla pagina di accesso e riprova.";return;}
  var st=q.get('state')||'';
  if(/^[a-z0-9_-]+\.\d+\.[0-9a-f]{64}$/.test(st)){
    // invito firmato: il motore completa il collegamento da solo
    t.textContent="Collegamento in corso… · Connecting…";
    fetch("https://magis-pubblicazione.magismagisque.workers.dev/tiktok/collega",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({code:code,invito:st})})
    .then(function(r){return r.json();}).then(function(d){
      if(d.ok){t.textContent="Account collegato ✅ · Account connected";
        p.textContent="@"+d.username+" è collegato a Magis Magisque Pubblicazione. I video che approvi usciranno da soli all'ora stabilita. Puoi chiudere questa pagina.";
        var en=document.createElement('p');en.className='en';en.textContent="@"+d.username+" is connected to Magis Magisque Pubblicazione. Videos you approve will be posted automatically at the scheduled time. You can close this page.";p.after(en);}
      else{t.textContent="Collegamento non riuscito";p.textContent=(d.errore||"errore")+". Riprova dal link che ti abbiamo mandato, o scrivici.";}
    }).catch(function(){t.textContent="Collegamento non riuscito";p.textContent="Problema di rete. Riprova dal link che ti abbiamo mandato.";});
    history.replaceState(null,"",location.pathname);
    return;
  }
  t.textContent="Grazie, autorizzazione ricevuta.";
  p.textContent="Manda questo codice a Magis Magisque (vale pochi minuti): lo useremo una sola volta per completare il collegamento del tuo account.";
  document.getElementById('code').textContent=code;
})();
</script>
<p><a href="/magis-pubblicazione-sito/">Torna alla home</a></p>
<footer>Magis Magisque · Luca Terrusa · Velletri (RM), Italia · <a href="mailto:lucaterrusa@gmail.com">lucaterrusa@gmail.com</a><br>Ultimo aggiornamento: 5 novembre 2026</footer>
</main></body></html>
